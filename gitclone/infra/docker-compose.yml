version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitclone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitclone_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-gitclone}
    ports:
      # Restricted to localhost interface only to prevent public network exposure
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Restricted to localhost interface only
      - "127.0.0.1:6379:6379"
    networks:
      - internal-net

volumes:
  pgdata:

networks:
  internal-net:
    driver: bridge
